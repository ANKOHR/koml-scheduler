[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koml-scheduler"
version = "0.1.0"
description = "Deterministic local task allocation across agents and tools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ks = "koml_scheduler.cli:main"

[tool.setuptools.packages.find]
include = ["koml_scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
